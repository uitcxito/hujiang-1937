<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沪江大学 · 一九三七年校园漫游</title>
    <link rel="stylesheet" href="src/campus.css" />
  </head>
  <body>
    <main id="view" aria-label="沪江大学三维校园"></main>
    <header>
      <div class="seal" aria-hidden="true">滬<br />江</div>
      <div>
        <h1>沪江大学</h1>
        <p>UNIVERSITY OF SHANGHAI</p>
      </div>
      <div class="date">1937<small>初夏</small></div>
    </header>
    <nav class="top">
      <button id="guide">校园导览</button
      ><button id="settings" aria-label="浏览设置" title="浏览设置">⚙</button>
    </nav>
    <section id="placeCard" hidden>
      <button class="close" aria-label="关闭建筑介绍">×</button>
      <div class="eyebrow" id="typeline"></div>
      <h2 id="placeTitle"></h2>
      <p id="placeStory"></p>
      <details>
        <summary>老照片与复原依据</summary>
        <p id="evidence"></p>
        <p id="inference"></p>
        <div id="photoLinks"></div>
        <a id="sourceLink" target="_blank" rel="noopener">建筑资料 ↗</a>　<a
          id="mapSource"
          target="_blank"
          rel="noopener"
          >档案馆平面图 ↗</a
        >
      </details>
      <button id="landHere">到建筑旁步行 →</button>
    </section>
    <section class="panel" id="placesPanel" hidden>
      <div class="panelHead">
        <h2>校园导览</h2>
        <button class="close" aria-label="关闭导览">×</button>
      </div>
      <label for="placeQuery">按名称定位建筑</label
      ><input id="placeQuery" type="search" placeholder="输入建筑名称" />
      <div id="placeList"></div>
    </section>
    <section class="panel" id="settingsPanel" hidden>
      <div class="panelHead">
        <h2>浏览设置</h2>
        <button class="close" aria-label="关闭设置">×</button>
      </div>
      <label for="quality">画面质量</label
      ><select id="quality">
        <option value="0">低 · 优先流畅</option>
        <option value="1" selected>中 · 均衡</option>
        <option value="2">高 · 近景细节</option></select
      ><label class="check"><input id="pinToggle" type="checkbox" checked />鸟瞰显示地名</label>
      <details>
        <summary>关于这次复原</summary>
        <p>
          时点取大礼堂建成后的1937年初夏。建筑占地以档案馆刊载的平面图为据，尺度由图中四分之一英里跑道估算。单体高度、立面细节与植物配置的推定可在建筑卡片中查看。
        </p>
        <a target="_blank" rel="noopener" href="https://dag.usst.edu.cn/2025/0527/c14228a342128/page.htm"
          >查看历史平面图 ↗</a
        >
      </details>
    </section>
    <div id="cross" hidden>+</div>
    <div class="bottomLeft">
      <small>当前位置</small>
      <div id="location">密氏校门</div>
    </div>
    <div id="dock">
      <button id="walk" aria-pressed="true">步行</button
      ><button id="orbit" aria-pressed="false">鸟瞰</button><b></b><button id="home">返回校门</button>
    </div>
    <div id="hint" aria-live="polite"></div>
    <section id="loading" role="status">正在打开沪江校园…</section>
    <script src="vendor/three.min.js"></script>
    <script src="src/atlas.js"></script>
    <script src="src/materials.js"></script>
    <script src="src/land.js"></script>
    <script src="src/buildings.js"></script>
    <script src="src/halls.js"></script>
    <script src="src/residences.js"></script>
    <script src="src/records.js"></script>
    <script src="src/garden.js"></script>
    <script src="assets/surfaces.js"></script>
    <script src="src/surfaces.js"></script>
    <script src="src/explore.js"></script>
  </body>
</html>
